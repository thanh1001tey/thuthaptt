<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Quản Trị - Thống Kê Truy Cập</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container" style="max-width: 900px;">
        <!-- Phần Đăng nhập -->
        <div id="login-card" class="card">
            <h2><i class="fas fa-lock"></i> Đăng nhập Quản trị (thanh1)</h2>
            <form id="login-form" style="margin-top: 15px; display: flex; flex-direction: column; gap: 12px;">
                <input type="text" id="username" placeholder="Tên đăng nhập" required style="padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff;">
                <input type="password" id="password" placeholder="Mật khẩu" required style="padding: 12px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: #fff;">
                <button type="submit" style="padding: 12px; background: #38bdf8; color: #020617; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Đăng nhập hệ thống</button>
                <p id="error-msg" style="color: #f43f5e; font-size: 0.85rem;"></p>
            </form>
            <p style="margin-top: 15px; text-align: center;"><a href="index.html" style="color: #38bdf8; text-decoration: none;">← Quay lại trang chủ</a></p>
        </div>

        <!-- Bảng Thống kê (Chỉ hiển thị khi nhập đúng thông tin) -->
        <div id="dashboard-card" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2><i class="fas fa-chart-line"></i> Nhật ký Truy cập Người dùng</h2>
                <button id="logout-btn" style="padding: 8px 14px; background: #f43f5e; color: #fff; border: none; border-radius: 8px; cursor: pointer;">Đăng xuất</button>
            </div>
            <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px;">Danh sách lịch sử toàn bộ người dùng đã ghé thăm trang web:</p>
            
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 2px solid #334155; color: #38bdf8;">
                            <th style="padding: 10px;">📅 Ngày giờ truy cập</th>
                            <th style="padding: 10px;">🌐 Địa chỉ IP</th>
                            <th style="padding: 10px;">💻 Thiết bị</th>
                            <th style="padding: 10px;">🌍 Trình duyệt</th>
                            <th style="padding: 10px;">⚙️ Độ phân giải / Múi giờ</th>
                        </tr>
                    </thead>
                    <tbody id="visitor-tbody">
                        <tr><td colspan="5" style="text-align: center; padding: 20px;">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
            <p style="margin-top: 20px; text-align: center;"><a href="index.html" style="color: #38bdf8; text-decoration: none;">← Về trang chủ</a></p>
        </div>
    </div>

    <script>
        const loginCard = document.getElementById('login-card');
        const dashboardCard = document.getElementById('dashboard-card');
        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const logoutBtn = document.getElementById('logout-btn');
        const tbody = document.getElementById('visitor-tbody');

        async function checkAuth() {
            try {
                const res = await fetch('/api/check-auth');
                if (res.ok) {
                    loginCard.classList.add('hidden');
                    dashboardCard.classList.remove('hidden');
                    fetchVisitors();
                }
            } catch (e) {}
        }

        async function fetchVisitors() {
            try {
                const res = await fetch('/api/visitors');
                if (!res.ok) throw new Error();
                const list = await res.json();

                if (list.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 20px; color: #94a3b8;">Chưa có lượt truy cập nào.</td></tr>`;
                    return;
                }

                tbody.innerHTML = list.map(v => `
                    <tr style="border-bottom: 1px solid #334155;">
                        <td style="padding: 10px; color: #38bdf8; white-space: nowrap;"><i class="far fa-clock"></i> ${v.time}</td>
                        <td style="padding: 10px; font-weight: bold; color: #22c55e;">${v.ip}</td>
                        <td style="padding: 10px;">${v.device}</td>
                        <td style="padding: 10px;">${v.browser}</td>
                        <td style="padding: 10px; color: #94a3b8;">${v.screen} • ${v.timezone}</td>
                    </tr>
                `).join('');
            } catch (e) {
                loginCard.classList.remove('hidden');
                dashboardCard.classList.add('hidden');
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    errorMsg.textContent = '';
                    loginCard.classList.add('hidden');
                    dashboardCard.classList.remove('hidden');
                    fetchVisitors();
                } else {
                    errorMsg.textContent = data.message;
                }
            } catch (err) {
                errorMsg.textContent = 'Lỗi kết nối đến server!';
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            dashboardCard.classList.add('hidden');
            loginCard.classList.remove('hidden');
            document.getElementById('password').value = '';
        });

        checkAuth();
    </script>
</body>
</html>
